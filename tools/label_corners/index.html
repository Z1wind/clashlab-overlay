<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>四角标注 · ClashLab</title>
<style>
  html,body{margin:0;height:100%;background:#14171c;color:#e8ecf1;font:14px/1.5 "Microsoft YaHei",system-ui,sans-serif}
  #wrap{display:flex;height:100%}
  #left{flex:1;display:flex;flex-direction:column;min-width:0}
  #bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#1c2128;border-bottom:1px solid #2b323c}
  #bar b{color:#8fd3ff}
  #stage{flex:1;position:relative;background:#0f1216;overflow:hidden}
  #canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);cursor:crosshair}
  #right{width:300px;border-left:1px solid #2b323c;display:flex;flex-direction:column;min-width:0}
  #hint{padding:10px 12px;border-bottom:1px solid #2b323c;color:#aab4c0;font-size:13px}
  #list{overflow:auto;flex:1}
  .item{padding:6px 10px;border-bottom:1px solid #20262e;cursor:pointer;font-size:12px;display:flex;justify-content:space-between;gap:6px}
  .item:hover{background:#1e2530}
  .item.active{background:#243447;color:#fff}
  .ok{color:#57d98a}
  .no{color:#7d8896}
  .btn{background:#2b3645;border:1px solid #3a4757;color:#dbe6f2;border-radius:6px;padding:5px 10px;cursor:pointer}
  .btn:hover{background:#35455a}
  .btn.primary{background:#2563eb;border-color:#3b82f6}
  .pts{color:#ffd166}
</style>
</head>
<body>
<div id="wrap">
  <div id="left">
    <div id="bar">
      <b>四角标注</b>
      <span id="prog">加载中…</span>
      <span id="file" style="color:#8b97a5;font-size:12px"></span>
      <span style="flex:1"></span>
      <button class="btn" id="undo">撤销 (Backspace)</button>
      <button class="btn" id="skip">跳过 (→)</button>
      <button class="btn primary" id="save">保存并下一张 (Enter)</button>
    </div>
    <div id="stage"><canvas id="canvas"></canvas></div>
  </div>
  <div id="right">
    <div id="hint">
      用鼠标依次点 <b>4 个角</b>：<span style="color:#ffd166">① 上</span> →
      <span style="color:#7ee787">② 右</span> → <span style="color:#79c0ff">③ 下</span> →
      <span style="color:#ffa657">④ 左</span>。<br>
      口径：<b>整张 44×44 地图最外圈格的四个角</b>，不是最外侧建筑/墙。<br>
      点错可撤销；Enter 保存进入下一张。
    </div>
    <div id="list"></div>
  </div>
</div>
<script>
var S={items:[],idx:0,img:null,pts:[],scale:1,ox:0,oy:0};
var COLORS=["#ffd166","#7ee787","#79c0ff","#ffa657"];
var LABELS=["上","右","下","左"];
var cv=document.getElementById("canvas"),ctx=cv.getContext("2d"),stage=document.getElementById("stage");
function api(p,opt){return fetch(p,opt).then(function(r){return r.json();});}
function load(){
  api("/api/list").then(function(j){
    S.items=j.items||[];
    var done=S.items.filter(function(x){return x.done;}).length;
    document.getElementById("prog").textContent="进度 "+done+" / "+S.items.length;
    renderList();
    var first=S.items.findIndex(function(x){return !x.done;});
    select(first>=0?first:0);
  });
}
function renderList(){
  var el=document.getElementById("list"); el.innerHTML="";
  S.items.forEach(function(it,i){
    var d=document.createElement("div");
    d.className="item"+(i===S.idx?" active":"");
    d.innerHTML="<span class='"+(it.done?"ok":"no")+"'>"+(it.done?"✔":"○")+"</span><span style='flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'>"+it.name+"</span>";
    d.onclick=function(){select(i);};
    el.appendChild(d);
  });
}
function select(i){
  if(!S.items.length)return;
  S.idx=Math.max(0,Math.min(i,S.items.length-1));
  S.pts=[]; renderList();
  var it=S.items[S.idx];
  document.getElementById("file").textContent=it.file+"  ("+Math.round(it.size/1024)+" KB)";
  var img=new Image();
  img.onload=function(){S.img=img;fit();draw();};
  img.src="/img?f="+encodeURIComponent(it.file)+"&t="+Date.now();
}
function fit(){
  if(!S.img)return;
  var availW=stage.clientWidth-20, availH=stage.clientHeight-20;
  S.scale=Math.min(availW/S.img.width, availH/S.img.height, 1);
  cv.width=Math.round(S.img.width*S.scale); cv.height=Math.round(S.img.height*S.scale);
  S.ox=0;S.oy=0;
}
function draw(){
  if(!S.img)return;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(S.img,0,0,cv.width,cv.height);
  ctx.lineWidth=2;
  if(S.pts.length){
    ctx.beginPath();
    S.pts.forEach(function(p,i){var x=p[0]*S.scale,y=p[1]*S.scale; if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);});
    if(S.pts.length===4){ctx.closePath();}
    ctx.strokeStyle="rgba(255,209,102,.9)";ctx.stroke();
  }
  S.pts.forEach(function(p,i){
    var x=p[0]*S.scale,y=p[1]*S.scale;
    ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fillStyle=COLORS[i];ctx.fill();
    ctx.fillStyle="#111";ctx.font="bold 11px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(String(i+1),x,y+0.5);
  });
}
cv.addEventListener("mousedown",function(e){
  if(!S.img||S.pts.length>=4)return;
  var r=cv.getBoundingClientRect();
  var x=(e.clientX-r.left)/S.scale, y=(e.clientY-r.top)/S.scale;
  S.pts.push([Math.round(x),Math.round(y)]); draw();
});
document.getElementById("undo").onclick=function(){S.pts.pop();draw();};
document.getElementById("skip").onclick=function(){select(S.idx+1);};
document.getElementById("save").onclick=function(){
  if(!S.img){return;}
  if(S.pts.length!==4){alert("需要 4 个点（当前 "+S.pts.length+" 个）");return;}
  var it=S.items[S.idx];
  api("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({file:it.file,quad:S.pts})}).then(function(j){
      if(!j.ok){alert("保存失败: "+(j.error||"未知"));return;}
      it.done=true;
      var done=S.items.filter(function(x){return x.done;}).length;
      document.getElementById("prog").textContent="进度 "+done+" / "+S.items.length;
      renderList();
      var next=S.items.findIndex(function(x,k){return k>S.idx&&!x.done;});
      if(next<0)next=S.items.findIndex(function(x){return !x.done;});
      select(next>=0?next:S.idx+1);
    });
};
document.addEventListener("keydown",function(e){
  if(e.key==="Backspace"){e.preventDefault();S.pts.pop();draw();}
  else if(e.key==="Enter"){e.preventDefault();document.getElementById("save").click();}
  else if(e.key==="ArrowRight"){e.preventDefault();select(S.idx+1);}
  else if(e.key==="ArrowLeft"){e.preventDefault();select(S.idx-1);}
});
window.addEventListener("resize",function(){fit();draw();});
load();
</script>
</body>
</html>
