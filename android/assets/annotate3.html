<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ClashLab 阵型标注 v0.2.1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f1318;color:#dde3ea;font-family:system-ui,"Microsoft YaHei",sans-serif;overflow:hidden;user-select:none}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#1b222c;flex-wrap:wrap}
#top b{color:#f0b84a;font-size:15px}
#top .sp{flex:1}
button{background:#2a3340;color:#dde3ea;border:1px solid #3a4556;border-radius:7px;padding:7px 10px;font-size:14px}
button.pri{background:#2e6b3e;border-color:#49a35f;color:#fff}
button.warn{background:#5a2f2f;border-color:#8a4a4a;color:#ffd9d9}
button.sec{background:#243447}
#steps{display:flex;gap:8px;padding:6px 10px;background:#151c24;font-size:12px;color:#8fa3bd;flex-wrap:wrap}
#steps span{padding:4px 9px;border-radius:12px;background:#1f2732;border:1px solid #2c3848}
#steps span.on{background:#3a5a8c;border-color:#6ea8fe;color:#fff}
#hint{padding:4px 10px;background:#111720;color:#9fb3c8;font-size:12px;min-height:20px}
#stage{position:relative;flex:1;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
canvas{display:block;max-width:100%;max-height:100%;touch-action:none}
#pal{max-height:150px;overflow-y:auto;background:#151b24;border-top:1px solid #263141;padding:5px 8px}
#pal .cat{color:#6f86a0;font-size:11px;margin:4px 2px 1px;display:inline-block;width:100%}
#pal button{display:inline-block;margin:2px 3px;padding:7px 8px;font-size:13px}
#bar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#111720;border-top:1px solid #263141;flex-wrap:wrap}
#bar .grow{flex:1}
#count{color:#ffd76a;font-size:13px}
#toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);background:#22304a;border:1px solid #40557a;color:#e8eef8;padding:9px 14px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:86%;text-align:center}
#toast.show{opacity:1}
#help{position:fixed;inset:8px;background:rgba(10,14,20,.97);border:1px solid #3a4a60;border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.8;color:#cfd8e5;display:none;overflow:auto;z-index:9}
#help h3{color:#f0b84a;margin:2px 0 8px}
#help b{color:#9fd0ff}
#help .ok{display:block;margin-top:10px;text-align:center}
#tip{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.62);border:1px solid #2a3646;border-radius:6px;padding:3px 8px;font-size:11px;color:#9fd0ff;pointer-events:none}
</style></head><body>
<div id="app">
  <div id="top"><b>阵型标注</b><button id="btnHelp">怎么用？</button><span class="sp"></span><button id="btnPrev">上一张</button><button id="btnNext">下一张</button></div>
  <div id="steps"><span id="st1" class="on">① 点四个角（可拖动）</span><span id="st2">② 选建筑</span><span id="st3">③ 点建筑中心</span></div>
  <div id="hint">黄点可以按住拖动，慢慢对准四角</div>
  <div id="stage"><canvas id="cv"></canvas><div id="tip">第 1/20 张</div></div>
  <div id="pal"></div>
  <div id="bar">
    <button id="btnUndo">撤销</button><button id="btnReset">重设四角</button><button id="btnClear" class="warn">清空本张</button>
    <span id="count">已标 0 栋</span><span class="grow"></span>
    <button id="btnNames" class="sec">名称:开</button><button id="btnExport">导出本张</button><button id="btnExportAll" class="pri">导出全部</button>
  </div>
</div>
<div id="toast"></div>
<div id="help"><h3>30 秒上手</h3>
  <b>第 1 步：点四个角（可拖动）</b><br>按顺序点：左上 → 右上 → 右下 → 左下。黄点出现后<b>按住黄点可以拖动</b>，拖到真正的角上。<br><br>
  <b>第 2 步：选建筑</b><br>下面按分类列出全部建筑，中文名；点一下选中。<br><br>
  <b>第 3 步：点建筑</b><br>点建筑中心，出现黄圈+中文名；点错点「撤销」或再点该圈删除。<br><br>
  <b>换图：</b>「下一张」自动保存进度。<br><b>导出：</b>「导出本张」/「导出全部」存 JSON 到「下载」；首次弹权限请点允许。
  <span class="ok"><button id="btnHelpOk" class="pri">知道了</button></span></div>
<script>
var IMAGES=[];for(var i=1;i<=20;i++){IMAGES.push('img/b'+(i<10?'0'+i:i)+'.jpg');}
var SNAME={'air-defense':'防空','air-sweeper':'吹风','hidden-tesla':'电塔','eagle-artillery':'鹰炮','scattershot':'散炮','inferno-tower':'地狱塔','x-bow':'连弩','wizard-tower':'法塔','cannon':'加农','archer-tower':'箭塔','mortar':'迫击','bomb-tower':'炸弹塔','monolith':'巨石','spell-tower':'法术塔','multi-archer-tower':'多箭','ricochet-cannon':'弹射','firespitter':'喷火','multi-gear-tower':'多齿轮','town-hall':'大本','clan-castle':'城堡','gold-storage':'金库','elixir-storage':'圣水瓶','dark-elixir-storage':'黑水库','gold-mine':'金矿','elixir-collector':'圣水收集','dark-elixir-drill':'黑水钻','army-camp':'兵营','barracks':'训练营','dark-barracks':'暗训练','spell-factory':'法术工厂','dark-spell-factory':'暗法术','workshop':'工坊','laboratory':'实验室','builder-hut':'工人屋','pet-house':'宠物屋','blacksmith':'铁匠铺','helper-hut':'帮手屋','hero-hall':'英雄大厅','bomb':'炸弹','giant-bomb':'巨型炸弹','air-bomb':'空中炸弹','seeking-air-mine':'搜空雷','spring-trap':'弹簧','skeleton-trap':'骷髅陷阱','tornado-trap':'龙卷风','mine':'地雷'};
var CNAME={'town-hall':'大本营','clan-castle':'部落城堡','gold-mine':'金矿','elixir-collector':'圣水收集器','dark-elixir-drill':'黑水钻井','gold-storage':'金币库','elixir-storage':'圣水瓶','dark-elixir-storage':'暗黑重油罐','army-camp':'兵营','barracks':'训练营','dark-barracks':'暗黑训练营','spell-factory':'法术工厂','dark-spell-factory':'暗黑法术工厂','builder-hut':'建筑工人小屋','laboratory':'实验室','workshop':'工坊','air-defense':'防空火箭','air-sweeper':'空气炮','hidden-tesla':'隐形特斯拉','eagle-artillery':'鹰火炮','scattershot':'散射炮','inferno-tower':'地狱之塔','x-bow':'X连弩','wizard-tower':'法师塔','cannon':'加农炮','archer-tower':'箭塔','mortar':'迫击炮','bomb-tower':'炸弹塔','monolith':'巨石碑','spell-tower':'法术塔','multi-archer-tower':'多重箭塔','ricochet-cannon':'弹射加农炮','firespitter':'喷火器','multi-gear-tower':'多重齿轮塔','pet-house':'宠物屋','blacksmith':'铁匠铺','helper-hut':'帮手小屋','hero-hall':'英雄大厅','bomb':'炸弹','giant-bomb':'巨型炸弹','air-bomb':'空中炸弹','seeking-air-mine':'搜索地雷','spring-trap':'弹簧陷阱','skeleton-trap':'骷髅陷阱','tornado-trap':'龙卷风陷阱','mine':'地雷'};
var CATS=[['防御',['air-defense','air-sweeper','hidden-tesla','eagle-artillery','scattershot','inferno-tower','x-bow','wizard-tower','cannon','archer-tower','mortar','bomb-tower','monolith','spell-tower','multi-archer-tower','ricochet-cannon','firespitter','multi-gear-tower']],
['核心',['town-hall','clan-castle','gold-storage','elixir-storage','dark-elixir-storage']],
['资源/军队',['gold-mine','elixir-collector','dark-elixir-drill','army-camp','barracks','dark-barracks','spell-factory','dark-spell-factory','workshop','laboratory','builder-hut','pet-house','blacksmith','helper-hut','hero-hall']],
['陷阱',['bomb','giant-bomb','air-bomb','seeking-air-mine','spring-trap','skeleton-trap','tornado-trap','mine']]];
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');var img=new Image(),cur=0,sel='air-defense',showNames=true;var state={};var dragIdx=-1;
function getState(i){if(!state[i])state[i]={corners:[],buildings:[]};return state[i];}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='show';clearTimeout(t._t);t._t=setTimeout(function(){t.className='';},1800);}
function saveLocal(){try{localStorage.setItem('clashlab_annot_v2',JSON.stringify(state));}catch(e){}}
function loadLocal(){try{var s=localStorage.getItem('clashlab_annot_v2');if(s)state=JSON.parse(s)||{};}catch(e){}}
function artW(){return img.naturalWidth||1;}function artH(){return img.naturalHeight||1;}
function loadImage(idx){cur=idx;document.getElementById('tip').textContent='第 '+(idx+1)+'/'+IMAGES.length+' 张';img.onload=function(){var s=Math.min(1,Math.min(window.innerWidth*0.98,1600)/artW());cv.width=Math.round(artW()*s);cv.height=Math.round(artH()*s);draw();updateUI();};img.src=IMAGES[idx];updateUI();}
function bil(u,v){var st=getState(cur);if(st.corners.length<4)return [u*cv.width,v*cv.height];var p0=st.corners[0],p1=st.corners[1],p2=st.corners[2],p3=st.corners[3];return[(1-u)*(1-v)*p0[0]+u*(1-v)*p1[0]+u*v*p2[0]+(1-u)*v*p3[0],(1-u)*(1-v)*p0[1]+u*(1-v)*p1[1]+u*v*p2[1]+(1-u)*v*p3[1]];}
function invBilinear(px,py){var u=.5,v=.5,i,p,e0,e1,du,dv,j00,j10,j01,j11,det,dU,dV;for(i=0;i<25;i++){p=bil(u,v);e0=p[0]-px;e1=p[1]-py;du=bil(u+1e-4,v);dv=bil(u,v+1e-4);j00=(du[0]-p[0])/1e-4;j10=(dv[0]-p[0])/1e-4;j01=(du[1]-p[1])/1e-4;j11=(dv[1]-p[1])/1e-4;det=j00*j11-j10*j01;if(Math.abs(det)<1e-9)break;dU=(e0*j11-e1*j10)/det;dV=(-e0*j01+e1*j00)/det;u-=dU;v-=dV;if(Math.abs(dU)+Math.abs(dV)<1e-7)break;}return[u,v];}
function draw(){if(!img.complete||!artW())return;ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);var st=getState(cur),k,t,a,b,c,d,i,p;
 if(st.corners.length===4){for(k=0;k<=44;k++){t=k/44;a=bil(t,0);b=bil(t,1);c=bil(0,t);d=bil(1,t);ctx.strokeStyle='rgba(80,200,255,.28)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.beginPath();ctx.moveTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.stroke();}}
 for(i=0;i<st.corners.length;i++){p=st.corners[i];ctx.beginPath();ctx.arc(p[0],p[1],12,0,7);ctx.fillStyle='rgba(255,209,102,.28)';ctx.fill();ctx.beginPath();ctx.arc(p[0],p[1],8,0,7);ctx.fillStyle='#ffd166';ctx.fill();ctx.fillStyle='#111';ctx.font='bold 13px sans-serif';ctx.fillText(String(i+1),p[0]+11,p[1]-11);}
 for(i=0;i<st.buildings.length;i++){var W=st.buildings[i];p=bil((W.tile[0]+.5)/44,(W.tile[1]+.5)/44);ctx.beginPath();ctx.arc(p[0],p[1],8,0,7);ctx.strokeStyle='#ffd166';ctx.lineWidth=2.5;ctx.stroke();ctx.fillStyle='rgba(255,209,102,.9)';ctx.beginPath();ctx.arc(p[0],p[1],3,0,7);ctx.fill();
  if(showNames){var label=SNAME[W.type]||W.type;ctx.font='bold 12px sans-serif';var tw=ctx.measureText(label).width;ctx.fillStyle='rgba(0,0,0,.62)';ctx.fillRect(p[0]+9,p[1]-17,tw+6,16);ctx.fillStyle='#ffd166';ctx.fillText(label,p[0]+12,p[1]-5);}}}
function canvasPos(ev){var r=cv.getBoundingClientRect();var pt=(ev.touches&&ev.touches[0])?ev.touches[0]:ev;return[(pt.clientX-r.left)*cv.width/r.width,(pt.clientY-r.top)*cv.height/r.height];}
function nearestCorner(p){var st=getState(cur),best=-1,bd=32,i,d;for(i=0;i<st.corners.length;i++){d=Math.hypot(st.corners[i][0]-p[0],st.corners[i][1]-p[1]);if(d<bd){bd=d;best=i;}}return best;}
function hitExisting(tile){var st=getState(cur),i;for(i=0;i<st.buildings.length;i++){var b=st.buildings[i];if(Math.abs(b.tile[0]-tile[0])<=.7&&Math.abs(b.tile[1]-tile[1])<=.7)return i;}return -1;}
function onDown(ev){ev.preventDefault();var p=canvasPos(ev),st=getState(cur);dragIdx=-1;
 if(st.corners.length>0){var ni=nearestCorner(p);if(ni>=0){dragIdx=ni;toast('拖动第 '+(ni+1)+' 个角');return;}}
 if(st.corners.length<4){st.corners.push([Math.round(p[0]),Math.round(p[1])]);if(st.corners.length===4){toast('标定完成，可拖黄点微调');document.getElementById('hint').textContent='② 选建筑 → ③ 点建筑中心（黄点可拖动微调）';}draw();updateUI();saveLocal();return;}
 var uv=invBilinear(p[0],p[1]);var tx=Math.round(uv[0]*44-.5),ty=Math.round(uv[1]*44-.5);if(tx<0||ty<0||tx>43||ty>43){toast('点在基地外了，往里点');return;}
 var hit=hitExisting([tx,ty]);if(hit>=0){st.buildings.splice(hit,1);toast('已删除该建筑');}else{st.buildings.push({type:sel,tile:[tx,ty]});toast('已放置：'+(CNAME[sel]||sel));}draw();updateUI();saveLocal();}
function onMove(ev){if(dragIdx<0)return;ev.preventDefault();var p=canvasPos(ev),st=getState(cur);st.corners[dragIdx]=[Math.round(p[0]),Math.round(p[1])];draw();}
function onUp(){if(dragIdx>=0){dragIdx=-1;saveLocal();updateUI();}}
function updateUI(){var st=getState(cur);document.getElementById('count').textContent='已标 '+st.buildings.length+' 栋';var a=document.getElementById('st1'),b=document.getElementById('st2'),c=document.getElementById('st3');a.className=st.corners.length<4?'on':'';b.className=(st.corners.length===4&&st.buildings.length===0)?'on':'';c.className=(st.corners.length===4&&st.buildings.length>0)?'on':'';if(st.corners.length<4)document.getElementById('hint').textContent='① 依次点：左上 → 右上 → 右下 → 左下（已点 '+st.corners.length+'/4，黄点可拖动）';}
function buildPalette(){var pal=document.getElementById('pal');pal.innerHTML='';CATS.forEach(function(cat){var d=document.createElement('div');d.className='cat';d.textContent=cat[0];pal.appendChild(d);cat[1].forEach(function(t){var b=document.createElement('button');b.textContent=(SNAME[t]||t)+' · '+(CNAME[t]||t);if(t===sel)b.className='on';b.onclick=function(){sel=t;buildPalette();toast('已选中：'+(CNAME[t]||t));};pal.appendChild(b);});});}
function saveDoc(st,imgPath){var cn=st.corners.map(function(p){return [p[0]/cv.width,p[1]/cv.height];});return {version:2,image:imgPath,image_size:[artW(),artH()],grid:44,corners:st.corners,corners_norm:cn,buildings:st.buildings.map(function(b){return {type:b.type,name:CNAME[b.type]||b.type,tile:b.tile};})};}
function exportOne(){var st=getState(cur);if(st.corners.length<4){toast('还没点四个角，不能导出');return;}var doc=saveDoc(st,IMAGES[cur]);doc.saved_at=new Date().toISOString();var name='annot_b'+(cur+1<10?'0'+(cur+1):(cur+1))+'.json';
 if(window.AndroidBridge&&window.AndroidBridge.saveFile){var r=window.AndroidBridge.saveFile(name,JSON.stringify(doc));if(r&&r.indexOf('OK:')===0)toast('已保存到下载：'+name);else if(r&&r.indexOf('OK')===0)toast('已保存到 App 目录：'+name);else toast('保存失败：'+r);}else{var a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(doc));a.download=name;a.click();toast('已导出 '+name);}}
function exportAll(){var docs=[];for(var i=0;i<IMAGES.length;i++){var st=getState(i);if(st.corners.length===4)docs.push(saveDoc(st,IMAGES[i]));}if(!docs.length){toast('还没有任何一张完成标定');return;}var all={version:2,count:docs.length,bases:docs};
 if(window.AndroidBridge&&window.AndroidBridge.saveFile){var r=window.AndroidBridge.saveFile('annot_all.json',JSON.stringify(all));if(r&&r.indexOf('OK:')===0)toast('已保存到下载：annot_all.json');else if(r&&r.indexOf('OK')===0)toast('已保存到 App 目录：annot_all.json');else toast('保存失败：'+r);}else{var a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(all));a.download='annot_all.json';a.click();toast('已导出全部');}}
document.getElementById('btnUndo').onclick=function(){var st=getState(cur);if(st.buildings.length)st.buildings.pop();else if(st.corners.length)st.corners.pop();draw();updateUI();saveLocal();toast('已撤销');};
document.getElementById('btnReset').onclick=function(){getState(cur).corners=[];getState(cur).buildings=[];draw();updateUI();saveLocal();toast('已重设四角');};
var clearArm=false,clearTimer=null;document.getElementById('btnClear').onclick=function(){var btn=this;if(!clearArm){clearArm=true;btn.textContent='再点一次确认';clearTimeout(clearTimer);clearTimer=setTimeout(function(){clearArm=false;btn.textContent='清空本张';},6000);return;}clearArm=false;clearTimeout(clearTimer);btn.textContent='清空本张';state[cur]={corners:[],buildings:[]};draw();updateUI();saveLocal();toast('已清空本张');};
document.getElementById('btnNames').onclick=function(){showNames=!showNames;this.textContent='名称:'+(showNames?'开':'关');draw();};
document.getElementById('btnNext').onclick=function(){saveLocal();if(cur<IMAGES.length-1)loadImage(cur+1);else toast('已经是最后一张');};
document.getElementById('btnPrev').onclick=function(){saveLocal();if(cur>0)loadImage(cur-1);else toast('已经是第一张');};
document.getElementById('btnExport').onclick=exportOne;document.getElementById('btnExportAll').onclick=exportAll;
document.getElementById('btnHelp').onclick=function(){document.getElementById('help').style.display='block';};
document.getElementById('btnHelpOk').onclick=function(){document.getElementById('help').style.display='none';};
cv.addEventListener('mousedown',onDown);cv.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onUp);
cv.addEventListener('touchstart',onDown,{passive:false});cv.addEventListener('touchmove',onMove,{passive:false});cv.addEventListener('touchend',onUp,{passive:false});
window.addEventListener('resize',function(){if(img.complete&&artW())draw();});
loadLocal();buildPalette();loadImage(0);
try{if(!localStorage.getItem('clashlab_seen_help_v3')){document.getElementById('help').style.display='block';localStorage.setItem('clashlab_seen_help_v3','1');}}catch(e){}
</script></body></html>
