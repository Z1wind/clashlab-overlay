<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ClashLab 战图标注</title>
<style>
html,body{margin:0;height:100%;background:#0f1318;color:#dde3ea;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
#top{display:flex;gap:6px;align-items:center;padding:6px 8px;background:#1b222c;flex-wrap:wrap}
#top b{color:#f0b84a}
button{background:#2a3340;color:#dde3ea;border:1px solid #3a4556;border-radius:6px;padding:6px 10px;font-size:14px}
button.on{background:#2e6b3e;border-color:#49a35f}
button.warn{background:#5a2f2f;border-color:#8a4a4a}
#hint{color:#8fa3bd;font-size:12px;padding:2px 8px 4px}
#stage{position:absolute;top:88px;bottom:88px;left:0;right:0;display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:100%;touch-action:none}
#pal{position:absolute;left:0;right:0;bottom:0;height:84px;overflow-x:auto;white-space:nowrap;background:#161c24;padding:6px 8px;box-sizing:border-box}
#pal button{display:inline-block;margin:2px 3px;padding:6px 8px;font-size:12px}
#badge{position:absolute;left:8px;top:92px;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:6px;font-size:12px;color:#9fd0ff;pointer-events:none}
</style></head><body>
<div id="top">
  <b>ClashLab 标注</b>
  <button class="tab on" data-img="img/w1.png">战图1</button>
  <button class="tab" data-img="img/w2.png">战图2</button>
  <button class="tab" data-img="img/w3.png">战图3</button>
  <button id="btnUndo">撤销</button>
  <button id="btnClear">清空</button>
  <button id="btnExport" class="warn">导出 JSON</button>
</div>
<div id="hint">① 依次点网格四角：左上(0,0) → 右上(44,0) → 右下(44,44) → 左下(0,44)　② 选类型后点建筑中心　③ 导出 JSON</div>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="badge">等待标定</div>
<div id="pal"></div>
<script>
var IMAGES = ['img/w1.png','img/w2.png','img/w3.png'];
var TYPES = [
 ['air-defense','防空火箭'],['air-sweeper','吹风机'],['hidden-tesla','特斯拉'],['monolith','巨石碑'],
 ['eagle-artillery','鹰炮'],['scattershot','散射炮'],['inferno-tower','地狱塔'],['x-bow','X连弩'],
 ['wizard-tower','法师塔'],['cannon','加农炮'],['archer-tower','箭塔'],['mortar','迫击炮'],
 ['bomb-tower','炸弹塔'],['clan-castle','部落城堡'],['spell-tower','法术塔'],['multi-archer-tower','多重箭塔'],
 ['town-hall','大本营'],['gold-mine','金矿'],['elixir-collector','圣水收集'],['gold-storage','金库'],
 ['elixir-storage','圣水瓶'],['dark-elixir-storage','黑水库'],['army-camp','兵营'],['barracks','训练营'],
 ['workshop','工坊'],['laboratory','实验室']
];
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var img = new Image(), imgPath = IMAGES[0];
var corners = [], buildings = [], sel = 'air-defense';
function toast(m){ try{ if(window.AndroidBridge) window.AndroidBridge.toast(m);}catch(e){} }
function badge(m){ document.getElementById('badge').textContent = m; }
img.onload = function(){ cv.width = img.naturalWidth; cv.height = img.naturalHeight; draw(); };
img.src = imgPath;
function bil(u,v){
  if(corners.length<4) return [u*cv.width, v*cv.height];
  var p0=corners[0],p1=corners[1],p2=corners[2],p3=corners[3];
  return [ (1-u)*(1-v)*p0[0]+u*(1-v)*p1[0]+u*v*p2[0]+(1-u)*v*p3[0],
           (1-u)*(1-v)*p0[1]+u*(1-v)*p1[1]+u*v*p2[1]+(1-u)*v*p3[1] ];
}
function invBilinear(px,py){
  var u=0.5,v=0.5,i,p,e0,e1,du,dv,j00,j10,j01,j11,det,dU,dV;
  for(i=0;i<30;i++){
    p=bil(u,v); e0=p[0]-px; e1=p[1]-py;
    du=bil(u+1e-4,v); dv=bil(u,v+1e-4);
    j00=(du[0]-p[0])/1e-4; j10=(dv[0]-p[0])/1e-4;
    j01=(du[1]-p[1])/1e-4; j11=(dv[1]-p[1])/1e-4;
    det=j00*j11-j10*j01; if(Math.abs(det)<1e-9) break;
    dU=(e0*j11-e1*j10)/det; dV=(-e0*j01+e1*j00)/det;
    u-=dU; v-=dV;
    if(Math.abs(dU)+Math.abs(dV)<1e-7) break;
  }
  return [u,v];
}
function draw(){
  ctx.drawImage(img,0,0);
  if(corners.length===4){
    ctx.strokeStyle='rgba(80,200,255,.45)'; ctx.lineWidth=Math.max(1,cv.width/900);
    var k,i,a,b,c,d;
    for(k=0;k<=44;k++){ i=k/44;
      a=bil(i,0); b=bil(i,1); c=bil(0,i); d=bil(1,i);
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(c[0],c[1]); ctx.lineTo(d[0],d[1]); ctx.stroke();
    }
  }
  var j,p2,W,H;
  for(j=0;j<corners.length;j++){ p2=corners[j];
    ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.arc(p2[0],p2[1],Math.max(5,cv.width/150),0,7); ctx.fill();
    ctx.fillStyle='#111'; ctx.font=Math.max(12,cv.width/80)+'px sans-serif'; ctx.fillText(String(j+1),p2[0]+8,p2[1]-8);
  }
  for(j=0;j<buildings.length;j++){
    W=buildings[j]; p2=bil((W.tile[0]+0.5)/44,(W.tile[1]+0.5)/44);
    H=Math.max(9,cv.width/80);
    ctx.fillStyle = W.type==='air-defense' ? '#e84a4a' : (W.type==='air-sweeper' ? '#f2a23c' : (W.type==='hidden-tesla' ? '#999' : '#50c8b4'));
    ctx.fillRect(p2[0]-H,p2[1]-H,2*H,2*H);
    ctx.fillStyle='#fff'; ctx.font=Math.max(10,cv.width/100)+'px sans-serif';
    ctx.fillText(String(j+1),p2[0]-H+2,p2[1]+4);
  }
  badge(corners.length<4 ? ('还需 '+(4-corners.length)+' 个角') : ('已标 '+buildings.length+' 栋 · '+sel));
}
function pos(ev){
  var r=cv.getBoundingClientRect();
  var t=ev.touches?ev.touches[0]:ev;
  return [ (t.clientX-r.left)*cv.width/r.width, (t.clientY-r.top)*cv.height/r.height ];
}
cv.addEventListener('pointerdown', function(ev){
  ev.preventDefault();
  var p=pos(ev);
  if(corners.length<4){ corners.push(p); draw(); return; }
  var uv=invBilinear(p[0],p[1]);
  if(uv[0]<-0.05||uv[0]>1.05||uv[1]<-0.05||uv[1]>1.05) return;
  buildings.push({type:sel, tile:[Math.round(uv[0]*44), Math.round(uv[1]*44)]});
  draw();
}, {passive:false});
document.querySelectorAll('.tab').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); imgPath=b.getAttribute('data-img'); img.src=imgPath;
    corners=[]; buildings=[]; draw();
  };
});
var pal=document.getElementById('pal');
TYPES.forEach(function(t){
  var b=document.createElement('button');
  b.textContent=t[1]; b.onclick=function(){ sel=t[0]; draw(); };
  if(t[0]===sel) b.classList.add('on');
  pal.appendChild(b);
});
document.getElementById('btnUndo').onclick=function(){ if(buildings.length){buildings.pop(); draw();} else if(corners.length){corners.pop(); draw();} };
document.getElementById('btnClear').onclick=function(){ corners=[]; buildings=[]; draw(); };
document.getElementById('btnExport').onclick=function(){
  if(corners.length<4){ toast('请先点 4 个角完成标定'); return; }
  var data={schema:'clashlab-annotator-v2', image:imgPath, grid:44, quad:corners,
            buildings:buildings, walls:[], exported_at:new Date().toISOString()};
  var json=JSON.stringify(data);
  var name='annotate_'+Date.now()+'.json';
  var res='';
  try{ if(window.AndroidBridge) res=window.AndroidBridge.saveFile(name, json); }catch(e){ res='ERR:'+e; }
  if(res && res.indexOf('ERR')===0) toast('保存失败: '+res);
  else toast('已导出 '+name+'（'+buildings.length+' 栋），可在下载目录/分享里找到');
};
</script></body></html>
