name: Bug report
description: 报告一个问题 / Report a bug
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happened
      description: 尽量给命令、日志（out/overlay/overlay.log 尾部）、截图
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected
  - type: input
    id: env
    attributes:
      label: 环境 / Environment
      placeholder: Windows 11 / Python 3.13 / LDPlayer 9 / 1280x720
  - type: textarea
    id: extra
    attributes:
      label: 其他 / Anything else
